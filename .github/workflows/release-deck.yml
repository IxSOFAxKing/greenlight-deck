name: Release Greenlight Deck

# Publishes packages/deck as GitHub Release v<version> (from package.json).
# Trigger it by pushing a matching tag (v0.3.0), or run it by hand from the
# Actions tab. The in-app updater reads latest-linux.yml from the newest release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APP_VERSION=$(node -p "require('./packages/deck/package.json').version")
          if [ "v$APP_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match packages/deck version v$APP_VERSION" >&2
            exit 1
          fi

      - name: Install
        run: yarn install --frozen-lockfile --ignore-engines --network-timeout 600000

      - name: Typecheck
        run: yarn deck typecheck

      - name: Release notes from CHANGELOG.md
        run: |
          VERSION=$(node -p "require('./packages/deck/package.json').version")
          awk -v v="## $VERSION" '$0==v {on=1; next} /^## / {on=0} on' packages/deck/CHANGELOG.md > packages/deck/release-notes.md
          if [ ! -s packages/deck/release-notes.md ]; then echo "Greenlight Deck $VERSION" > packages/deck/release-notes.md; fi
          cat packages/deck/release-notes.md

      - name: Build and publish AppImage
        run: |
          yarn deck build
          cd packages/deck
          npx electron-builder --linux AppImage --publish always -c.releaseInfo.releaseNotesFile=release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach installer script
        run: |
          VERSION=$(node -p "require('./packages/deck/package.json').version")
          gh release upload "v$VERSION" packages/deck/deck/install.sh --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
